name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_versions.py
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q rtsp_assist_gateway tests scripts
      - run: python scripts/verify_packaging.py
