name: RTSP Assist Gateway
version: "0.3.0"
slug: rtsp_assist_gateway
description: "Experimental RTSP audio activation canaries."
advanced: true
stage: experimental
arch:
  - amd64
  - aarch64
init: true
startup: application
boot: manual
hassio_api: true
homeassistant_api: true
services:
  - mqtt:need
options:
  log_level: info
  sources: []
  passive_canary:
    enabled: false
    source_id: ""
    wyoming_uri: tcp://47701997-microwakeword:10400
    models:
      - hey_jarvis
    cooldown_seconds: 3
  ha_stt_canary:
    enabled: false
    source_id: ""
    pipeline_id: ""
    wake_words:
      - id: hey_jarvis
        aliases:
          - hey jarvis
    cooldown_seconds: 3
    max_requests_per_minute: 6
    max_audio_seconds_per_hour: 300
    max_audio_seconds_per_day: 1800
  ha_stt_activation:
    enabled: false
    source_id: ""
    pipeline_id: ""
    wake_words:
      - id: hey_jarvis
        aliases:
          - hey jarvis
    cooldown_seconds: 3
    max_requests_per_minute: 6
    max_audio_seconds_per_hour: 300
    max_audio_seconds_per_day: 1800
  microwakeword_activation:
    enabled: false
    source_id: ""
    wyoming_uri: tcp://47701997-microwakeword:10400
    wake_words:
      - model: hey_jarvis
        id: hey_jarvis
        aliases:
          - hey jarvis
    pipeline_id: ""
    cooldown_seconds: 3
    max_requests_per_minute: 6
    max_audio_seconds_per_hour: 300
    max_audio_seconds_per_day: 1800
schema:
  log_level: list(debug|info|warning|error)
  sources:
    - id: str
      url: str
      room: str
  passive_canary:
    enabled: bool
    source_id: str
    wyoming_uri: str
    models:
      - str
    cooldown_seconds: int(0,300)
  ha_stt_canary:
    enabled: bool
    source_id: str
    pipeline_id: str
    wake_words:
      - id: str
        aliases:
          - str
    cooldown_seconds: int(0,300)
    max_requests_per_minute: int(1,60)
    max_audio_seconds_per_hour: int(16,3600)
    max_audio_seconds_per_day: int(16,86400)
  ha_stt_activation:
    enabled: bool
    source_id: str
    pipeline_id: str
    wake_words:
      - id: str
        aliases:
          - str
    cooldown_seconds: int(0,300)
    max_requests_per_minute: int(1,60)
    max_audio_seconds_per_hour: int(16,3600)
    max_audio_seconds_per_day: int(16,86400)
  microwakeword_activation:
    enabled: bool
    source_id: str
    wyoming_uri: str
    wake_words:
      - model: str
        id: str
        aliases:
          - str
    pipeline_id: str
    cooldown_seconds: int(0,300)
    max_requests_per_minute: int(1,60)
    max_audio_seconds_per_hour: int(16,3600)
    max_audio_seconds_per_day: int(16,86400)
